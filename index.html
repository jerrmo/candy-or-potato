<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Candy or Potato?!</title>
<style>
  :root{
    --bg-0: #07030c;
    --bg-1: #150a24;
    --bg-2: #1f0f33;
    --orange: #ff7518;
    --orange-bright: #ffab3d;
    --purple: #9b5cff;
    --green: #39ff14;
    --gold: #ffd700;
    --pink: #ff2fb0;
    --cream: #fdf3d8;
    --item-height: 140px;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-0);
    color: var(--cream);
    font-family: 'Arial Black', 'Segoe UI Black', 'Helvetica Neue', system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    cursor: none; /* kiosk display across the room — no mouse pointer clutter */
  }

  #screen-start{ cursor: pointer; }

  #app{
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 30%, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
  }

  /* ---------- vignette / flicker ambience, always present ---------- */
  #vignette{
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.65) 100%);
    animation: flicker 6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%, 100% { opacity: 1; }
    45%      { opacity: 0.86; }
    50%      { opacity: 1; }
    52%      { opacity: 0.92; }
    75%      { opacity: 1; }
  }

  /* ---------- generic screen handling ---------- */
  .screen{
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
    padding: 4vh 4vw;
  }
  .screen.active{ display: flex; }

  /* ---------- START screen ---------- */
  #screen-start .pumpkin-big{
    font-size: clamp(5rem, 16vw, 12rem);
    animation: bob 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(255,140,0,0.7));
  }
  #screen-start h1{
    margin-top: 2vh;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    letter-spacing: 0.04em;
    color: var(--orange-bright);
    text-shadow: 0 0 20px rgba(255,120,0,0.8), 0 0 60px rgba(255,60,0,0.5);
  }
  #screen-start p{
    margin-top: 2vh;
    font-family: 'Helvetica Neue', system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(1rem, 2.2vw, 1.6rem);
    color: var(--cream);
    opacity: 0.85;
    letter-spacing: 0.03em;
  }
  @keyframes bob{
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-14px) rotate(2deg); }
  }

  /* ---------- IDLE screen ---------- */
  #idle-decor{
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .bat, .ghost{ position: absolute; will-change: transform, opacity; }
  .bat{ animation-name: flyAcross; animation-timing-function: linear; animation-iteration-count: infinite; opacity: 0.85; }
  .ghost{ animation-name: floatGhost; animation-timing-function: ease-in-out; animation-iteration-count: infinite; opacity: 0.55; }
  @keyframes flyAcross{
    from { transform: translateX(-10vw) translateY(0); }
    to   { transform: translateX(110vw) translateY(-6vh); }
  }
  @keyframes floatGhost{
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.45; }
    50%      { transform: translateY(-3vh) scale(1.08); opacity: 0.75; }
  }

  #screen-idle .idle-pumpkin{
    position: relative;
    z-index: 2;
    font-size: clamp(4rem, 12vw, 8rem);
    opacity: 0.9;
    animation: pumpkinPulse 3s ease-in-out infinite;
    filter: drop-shadow(0 0 40px rgba(255,140,0,0.6));
  }
  @keyframes pumpkinPulse{
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }

  .idle-prompt{
    position: relative;
    z-index: 2;
    margin-top: 3vh;
    font-size: clamp(2.4rem, 8vw, 6.5rem);
    line-height: 1.05;
    letter-spacing: 0.03em;
    color: var(--orange-bright);
    animation: promptPulse 1.6s ease-in-out infinite;
  }
  @keyframes promptPulse{
    0%, 100% { transform: scale(1); text-shadow: 0 0 20px rgba(255,140,0,0.7), 0 0 40px rgba(255,60,0,0.4); }
    50%      { transform: scale(1.045); text-shadow: 0 0 50px rgba(255,170,0,0.95), 0 0 100px rgba(255,60,0,0.7); }
  }

  .idle-sub{
    position: relative;
    z-index: 2;
    margin-top: 2.5vh;
    font-family: 'Helvetica Neue', system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(1rem, 2.4vw, 1.7rem);
    color: var(--cream);
    opacity: 0.8;
    letter-spacing: 0.02em;
  }

  /* ---------- SPIN screen ---------- */
  .spin-title{
    font-size: clamp(1.2rem, 3vw, 2rem);
    letter-spacing: 0.5em;
    color: var(--purple);
    margin-bottom: 3vh;
    text-shadow: 0 0 20px rgba(155,92,255,0.8);
  }
  #reel-window{
    position: relative;
    width: min(92vw, 1500px);
    height: 56vh;
    overflow: hidden;
    border: 6px solid var(--orange);
    border-radius: 24px;
    background: linear-gradient(180deg, #150a24, #0a0413 50%, #150a24);
    box-shadow:
      0 0 0 3px rgba(255,140,0,0.25) inset,
      0 0 50px rgba(255,120,0,0.55),
      0 0 120px rgba(155,92,255,0.25);
    animation: reelGlow 1.1s ease-in-out infinite;
  }
  @keyframes reelGlow{
    0%, 100% { box-shadow: 0 0 0 3px rgba(255,140,0,0.25) inset, 0 0 50px rgba(255,120,0,0.55), 0 0 120px rgba(155,92,255,0.25); }
    50%      { box-shadow: 0 0 0 3px rgba(255,180,0,0.4) inset, 0 0 90px rgba(255,150,0,0.85), 0 0 160px rgba(155,92,255,0.45); }
  }
  #reel-track{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    will-change: transform;
  }
  .reel-item{
    height: var(--item-height);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4em;
    font-size: clamp(1.6rem, 4.6vw, 3.6rem);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #fff;
    text-shadow: 0 0 12px rgba(255,150,0,0.5);
  }
  .reel-item.tier-double{ color: var(--orange-bright); text-shadow: 0 0 18px rgba(255,150,0,0.85); }
  .reel-item.tier-jackpot{ color: var(--gold); text-shadow: 0 0 22px rgba(255,215,0,0.95); }

  .reel-shade{ position: absolute; left: 0; right: 0; height: 34%; pointer-events: none; z-index: 3; }
  .reel-shade-top{ top: 0; background: linear-gradient(to bottom, rgba(7,3,12,0.95), rgba(7,3,12,0)); }
  .reel-shade-bottom{ bottom: 0; background: linear-gradient(to top, rgba(7,3,12,0.95), rgba(7,3,12,0)); }
  .reel-center-line{
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: var(--item-height);
    transform: translateY(-50%);
    border-top: 2px solid rgba(255,180,60,0.55);
    border-bottom: 2px solid rgba(255,180,60,0.55);
    pointer-events: none;
    z-index: 2;
  }

  /* ---------- REVEAL screen ---------- */
  .reveal-icon{
    font-size: clamp(3.5rem, 14vw, 9rem);
    animation: revealPop 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  .reveal-label{
    margin-top: 1.5vh;
    font-size: clamp(2.6rem, 9vw, 7.5rem);
    letter-spacing: 0.03em;
    animation: revealPop 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes revealPop{
    0%   { transform: scale(0.3); opacity: 0; }
    60%  { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .reveal-label.tier-normal{ color: var(--cream); text-shadow: 0 0 30px rgba(255,255,255,0.5); }
  .reveal-label.tier-double{
    color: var(--orange-bright);
    text-shadow: 0 0 40px rgba(255,150,0,0.9), 0 0 90px rgba(255,80,0,0.6);
  }
  .reveal-label.tier-jackpot{
    background: linear-gradient(90deg, var(--orange), var(--gold), var(--pink), var(--purple), var(--orange));
    background-size: 400% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: revealPop 0.5s cubic-bezier(.2,1.4,.4,1), jackpotShift 1.6s linear infinite;
    filter: drop-shadow(0 0 30px rgba(255,180,0,0.7));
  }
  @keyframes jackpotShift{
    0%   { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
  }

  /* Family-specific personality: candy sparkles, potato wobbles. */
  .reveal-icon.family-potato, .reveal-label.family-potato{
    animation: revealPop 0.5s cubic-bezier(.2,1.4,.4,1), potatoWobble 0.7s ease-in-out 0.5s 2;
  }
  @keyframes potatoWobble{
    0%, 100% { transform: scale(1) rotate(0deg); }
    25%      { transform: scale(1.08,0.92) rotate(-4deg); }
    50%      { transform: scale(0.94,1.06) rotate(3deg); }
    75%      { transform: scale(1.05,0.95) rotate(-2deg); }
  }

  /* Double Potato: the goofiest outcome — exaggerated squash & stretch,
     overriding the plain potato wobble above with something bigger. */
  .reveal-icon.tier-double.family-potato, .reveal-label.tier-double.family-potato{
    animation: revealPop 0.5s cubic-bezier(.2,1.4,.4,1), potatoWobbleBig 0.55s ease-in-out 0.4s 5;
  }
  @keyframes potatoWobbleBig{
    0%, 100% { transform: scale(1) rotate(0deg); }
    20%      { transform: scale(1.24,0.78) rotate(-9deg); }
    40%      { transform: scale(0.80,1.22) rotate(8deg); }
    60%      { transform: scale(1.18,0.84) rotate(-6deg); }
    80%      { transform: scale(0.88,1.12) rotate(4deg); }
  }

  /* Double Candy: elegant twinkle rather than a wobble, for contrast */
  .reveal-label.tier-double.family-candy{
    animation: revealPop 0.5s cubic-bezier(.2,1.4,.4,1), candySparkle 0.5s ease-in-out 0.5s 4;
  }
  @keyframes candySparkle{
    0%, 100% { text-shadow: 0 0 40px rgba(255,150,0,0.9), 0 0 90px rgba(255,80,0,0.6); }
    50%      { text-shadow: 0 0 60px rgba(255,200,80,1), 0 0 130px rgba(255,120,0,0.85), 0 0 10px #fff; }
  }

  /* Screen shake, triggered only for the Double Potato reveal */
  #app.shake{ animation: screenShake 0.5s ease-in-out; }
  @keyframes screenShake{
    0%, 100% { transform: translate(0,0) rotate(0deg); }
    10%      { transform: translate(-6px,4px) rotate(-0.5deg); }
    20%      { transform: translate(6px,-4px) rotate(0.5deg); }
    30%      { transform: translate(-8px,2px) rotate(-0.6deg); }
    40%      { transform: translate(8px,-2px) rotate(0.6deg); }
    50%      { transform: translate(-5px,3px) rotate(-0.3deg); }
    60%      { transform: translate(5px,-3px) rotate(0.3deg); }
    70%      { transform: translate(-3px,1px); }
    80%      { transform: translate(3px,-1px); }
    90%      { transform: translate(-1px,0); }
  }

  /* ---------- flash overlay ---------- */
  #flash-overlay{
    position: fixed;
    inset: 0;
    z-index: 900;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
  }
  .flash-normal{ background: #fff3d6; animation: flashPulse 0.35s ease-out 1; }
  .flash-double{ background: #ffb347; animation: flashPulse 0.4s ease-out 2; }
  .flash-jackpot{
    background: linear-gradient(45deg, var(--orange), var(--gold), var(--pink), var(--purple));
    background-size: 400% 400%;
    animation: flashPulse 0.45s ease-out 3;
  }
  @keyframes flashPulse{
    0%   { opacity: 0; }
    12%  { opacity: 0.85; }
    100% { opacity: 0; }
  }

  /* ---------- confetti ---------- */
  #confetti-container{
    position: fixed;
    inset: 0;
    z-index: 500;
    pointer-events: none;
    overflow: hidden;
  }
  .confetti-piece{
    position: absolute;
    top: -20px;
    width: 12px;
    height: 18px;
    opacity: 0.95;
    animation-name: confettiFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall{
    0%   { transform: translateY(-5vh) translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(112vh) translateX(var(--drift)) rotate(var(--rot)); opacity: 0.85; }
  }
  .confetti-piece.confetti-emoji{
    width: auto;
    height: auto;
    background: none !important;
    line-height: 1;
  }
  .confetti-piece.confetti-potato{ animation-name: potatoDrop; }
  @keyframes potatoDrop{
    0%   { transform: translateY(-5vh) rotate(0deg); opacity: 1; }
    55%  { transform: translateY(66vh) rotate(var(--rot)); }
    68%  { transform: translateY(54vh) rotate(var(--rot)); }
    82%  { transform: translateY(88vh) rotate(var(--rot)); }
    90%  { transform: translateY(80vh) rotate(var(--rot)); }
    100% { transform: translateY(112vh) translateX(var(--drift)) rotate(var(--rot)); opacity: 0.85; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="vignette"></div>

  <!-- 1. START — one click unlocks audio + fullscreen, then never needed again -->
  <div id="screen-start" class="screen active">
    <div class="pumpkin-big">🎃</div>
    <h1>CANDY or POTATO?!</h1>
    <p>Tap anywhere to start the night</p>
  </div>

  <!-- 2. IDLE / attract screen -->
  <div id="screen-idle" class="screen">
    <div id="idle-decor"></div>
    <div class="idle-pumpkin">🎃</div>
    <div class="idle-prompt">PRESS THE<br>BUTTON</div>
    <div class="idle-sub">🍬 candy&nbsp;&nbsp;·&nbsp;&nbsp;🥔 potato&nbsp;&nbsp;·&nbsp;&nbsp;or worse...</div>
  </div>

  <!-- 3. SPIN — weighted winner picked up front, reel animates to it -->
  <div id="screen-spin" class="screen">
    <div class="spin-title">SPINNING</div>
    <div id="reel-window">
      <div id="reel-track"></div>
      <div class="reel-center-line"></div>
      <div class="reel-shade reel-shade-top"></div>
      <div class="reel-shade reel-shade-bottom"></div>
    </div>
  </div>

  <!-- 4. REVEAL -->
  <div id="screen-reveal" class="screen">
    <div id="reveal-icon" class="reveal-icon"></div>
    <div id="reveal-label" class="reveal-label"></div>
  </div>

  <div id="flash-overlay"></div>
  <div id="confetti-container"></div>
</div>

<script>
"use strict";

/* =====================================================================
   CONFIG — the only place you should need to touch mid-evening.
   Edit a value below and reload the page (F5) to apply it. No build
   step, nothing else to run — just save the file and hit reload.
   ===================================================================== */
const CONFIG = {

  // Possible outcomes. `weight` is RELATIVE, not a percentage — the
  // numbers don't need to add up to 100 or anything in particular. A
  // kid's odds of getting outcome X are simply weight(X) / sum(all
  // weights). Add, remove, rename, or retune outcomes freely; the reel,
  // sounds, and confetti all read from this list automatically, keyed
  // off each outcome's `tier` (normal / double / jackpot).
  OUTCOMES: [
    { id: 'candy',        label: 'CANDY!',         tier: 'normal',  family: 'candy',  icon: '🍬',      weight: 40 },
    { id: 'potato',       label: 'POTATO!',        tier: 'normal',  family: 'potato', icon: '🥔',      weight: 40 },
    { id: 'doubleCandy',  label: 'DOUBLE CANDY!',  tier: 'double',  family: 'candy',  icon: '🍬🍬',    weight: 8  },
    { id: 'doublePotato', label: 'DOUBLE POTATO!', tier: 'double',  family: 'potato', icon: '🥔🥔',    weight: 8  },
    { id: 'both',         label: 'BOTH!!',         tier: 'jackpot', family: 'both',   icon: '🍬🎉🥔',  weight: 4  },
  ],

  // Key(s) that trigger a spin while idle. Leave null (or an empty
  // array) to accept ANY key — handy since the arcade button's USB HID
  // encoder can be configured to send whatever key is easiest. Set e.g.
  // ['Enter'] or [' ', 'Enter'] to restrict to specific keys instead.
  ACCEPTED_KEYS: null,

  SPIN_DURATION_MS: 2500,             // how long the reel spins before landing
  RESULT_HOLD_MS: 6000,               // how long the result stays up before auto-reset
  REEL_VISIBLE_ROWS: 3,               // rows visible in the slot-machine window

  MASTER_VOLUME: 0.8,                 // 0–1, quick way to turn the whole night up/down
  REQUEST_FULLSCREEN_ON_START: true,  // best-effort fullscreen on the opening tap
};

/* =====================================================================
   DOM references
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const els = {
  app:          $('app'),
  screenStart:  $('screen-start'),
  screenIdle:   $('screen-idle'),
  screenSpin:   $('screen-spin'),
  screenReveal: $('screen-reveal'),
  idleDecor:    $('idle-decor'),
  reelWindow:   $('reel-window'),
  reelTrack:    $('reel-track'),
  revealIcon:   $('reveal-icon'),
  revealLabel:  $('reveal-label'),
  flash:        $('flash-overlay'),
  confetti:     $('confetti-container'),
};

/* =====================================================================
   Weighted random selection
   ===================================================================== */
function pickWeightedOutcome(){
  const total = CONFIG.OUTCOMES.reduce((sum, o) => sum + o.weight, 0);
  let r = Math.random() * total;
  for (const o of CONFIG.OUTCOMES){
    if (r < o.weight) return o;
    r -= o.weight;
  }
  return CONFIG.OUTCOMES[CONFIG.OUTCOMES.length - 1]; // float-rounding fallback
}

// Used only for the cosmetic labels that fly by mid-spin — NOT for
// picking the winner, so it's plain uniform random rather than weighted.
function randomOutcome(){
  return CONFIG.OUTCOMES[Math.floor(Math.random() * CONFIG.OUTCOMES.length)];
}

function easeOutQuint(t){ return 1 - Math.pow(1 - t, 5); }

/* =====================================================================
   Audio engine — everything procedural via Web Audio, zero asset files
   ===================================================================== */
const SFX = (() => {
  let ctx = null;
  let ambient = null; // { o1, o2, lfo, g } while idle drone is running
  const vol = CONFIG.MASTER_VOLUME;

  function ctxNow(){
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    return ctx;
  }

  // Call from the start-screen click — the one user gesture we get.
  function unlock(){
    const c = ctxNow();
    if (!c) return;
    if (c.state === 'suspended') c.resume();
    const o = c.createOscillator();
    const g = c.createGain();
    g.gain.value = 0.0001;
    o.connect(g).connect(c.destination);
    o.start();
    o.stop(c.currentTime + 0.05);
  }

  // Shared noise-burst helper — a short burst of filtered white noise.
  // 'lowpass' => thud/plop, 'highpass' => shimmer/sparkle.
  function noiseHit(startOffset, duration, filterType, freq, gain, q){
    const c = ctxNow();
    if (!c) return;
    const t = c.currentTime + startOffset;
    const size = Math.max(1, Math.floor(c.sampleRate * duration));
    const buffer = c.createBuffer(1, size, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < size; i++){
      data[i] = (Math.random() * 2 - 1) * (1 - i / size); // white noise, linear decay
    }
    const src = c.createBufferSource();
    src.buffer = buffer;
    const filter = c.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = freq;
    filter.Q.value = q || 0.8;
    const g = c.createGain();
    g.gain.value = gain * vol;
    src.connect(filter).connect(g).connect(c.destination);
    src.start(t);
  }

  function tick(){
    const c = ctxNow();
    if (!c) return;
    const t = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(650 + Math.random() * 180, t);
    g.gain.setValueAtTime(0.16 * vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + 0.07);
  }

  // "Brass" voice: two slightly-detuned sawtooths through a filter that
  // swells open on attack, for a fanfare-horn character.
  function brass(freq, startOffset, duration, gain){
    const c = ctxNow();
    if (!c) return;
    const t = c.currentTime + startOffset;
    const o1 = c.createOscillator();
    const o2 = c.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'sawtooth';
    o1.frequency.setValueAtTime(freq, t);
    o2.frequency.setValueAtTime(freq, t);
    o2.detune.setValueAtTime(9, t); // thickens the tone

    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.value = 3;
    filter.frequency.setValueAtTime(freq * 1.4, t);
    filter.frequency.linearRampToValueAtTime(freq * 6, t + 0.03);
    filter.frequency.exponentialRampToValueAtTime(freq * 2, t + duration);

    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain * vol, t + 0.02);
    g.gain.linearRampToValueAtTime(gain * 0.7 * vol, t + duration * 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    o1.connect(filter); o2.connect(filter); filter.connect(g); g.connect(c.destination);
    o1.start(t); o2.start(t);
    o1.stop(t + duration + 0.05); o2.stop(t + duration + 0.05);
  }

  function brassChord(freqs, startOffset, duration, gainEach){
    freqs.forEach((f) => brass(f, startOffset, duration, gainEach));
  }

  // Comedic pitch-bending "boioioing" — the potato sound effect.
  function boing(startOffset, startFreq, endFreq, duration, gain){
    const c = ctxNow();
    if (!c) return;
    const t = c.currentTime + startOffset;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(startFreq, t);
    o.frequency.exponentialRampToValueAtTime(endFreq, t + duration);

    const lfo = c.createOscillator();
    lfo.frequency.value = 18; // silly wobble
    const lfoGain = c.createGain();
    lfoGain.gain.value = startFreq * 0.15;
    lfo.connect(lfoGain).connect(o.frequency);

    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain * vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    o.connect(g).connect(c.destination);
    o.start(t); lfo.start(t);
    o.stop(t + duration + 0.05); lfo.stop(t + duration + 0.05);
  }

  // Low timpani-style hit for the jackpot finale.
  function timpani(startOffset, duration, gain){
    const c = ctxNow();
    if (!c) return;
    const t = c.currentTime + startOffset;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(60, t + duration);
    const g = c.createGain();
    g.gain.setValueAtTime(gain * vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + duration + 0.05);
  }

  // ---- Per-outcome fanfares, scaled up in size/drama with rarity ----

  function revealCandy(){ // normal — short & sparkly
    brass(523.25, 0, 0.16, 0.26);      // C5
    brass(659.25, 0.12, 0.16, 0.26);   // E5
    brass(783.99, 0.24, 0.32, 0.30);   // G5, sustained
    noiseHit(0.24, 0.25, 'highpass', 3200, 0.14);
  }

  function revealPotato(){ // normal — a single comedic boing
    boing(0, 260, 120, 0.32, 0.30);
    noiseHit(0.28, 0.12, 'lowpass', 220, 0.22);
  }

  function revealDoubleCandy(){ // double — bigger sparkling chord run
    brassChord([392.00, 523.25], 0, 0.20, 0.20);             // G4+C5
    brassChord([523.25, 659.25], 0.16, 0.20, 0.22);          // C5+E5
    brassChord([659.25, 783.99, 1046.50], 0.32, 0.55, 0.26); // E5+G5+C6 sustain
    noiseHit(0.34, 0.4, 'highpass', 4200, 0.20);
  }

  function revealDoublePotato(){ // double — TWO boings, sillier and louder
    boing(0, 240, 100, 0.28, 0.30);
    boing(0.26, 280, 110, 0.28, 0.32);
    noiseHit(0.28, 0.14, 'lowpass', 200, 0.26);
    noiseHit(0.56, 0.18, 'lowpass', 170, 0.30);
  }

  function revealBoth(){ // jackpot — full fanfare, with a wink to both prizes
    brassChord([523.25, 659.25, 783.99], 0, 0.20, 0.22);
    brassChord([659.25, 783.99, 1046.50], 0.18, 0.20, 0.24);
    brassChord([783.99, 1046.50, 1318.51], 0.36, 0.70, 0.30); // big finale chord
    boing(0.06, 320, 170, 0.15, 0.10); // cheeky little potato underneath
    timpani(0.36, 0.5, 0.32);
    noiseHit(0.36, 0.3, 'lowpass', 150, 0.28);
    noiseHit(0.40, 0.5, 'highpass', 5000, 0.22);
  }

  function startAmbient(){
    const c = ctxNow();
    if (!c || ambient) return;
    const o1 = c.createOscillator();
    const o2 = c.createOscillator();
    o1.type = 'sine'; o1.frequency.value = 55;
    o2.type = 'sine'; o2.frequency.value = 58; // slight detune -> eerie beating
    const g = c.createGain();
    g.gain.value = 0.0001;
    g.gain.linearRampToValueAtTime(0.03 * vol, c.currentTime + 1.2);
    const lfo = c.createOscillator();
    lfo.frequency.value = 0.12;
    const lfoGain = c.createGain();
    lfoGain.gain.value = 0.012 * vol;
    lfo.connect(lfoGain).connect(g.gain);
    o1.connect(g); o2.connect(g); g.connect(c.destination);
    o1.start(); o2.start(); lfo.start();
    ambient = { o1, o2, lfo, g };
  }

  function stopAmbient(){
    const c = ctxNow();
    if (!c || !ambient) return;
    const { o1, o2, lfo, g } = ambient;
    const t = c.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.4);
    setTimeout(() => { o1.stop(); o2.stop(); lfo.stop(); }, 450);
    ambient = null;
  }

  return { unlock, tick, revealCandy, revealPotato, revealDoubleCandy, revealDoublePotato, revealBoth, startAmbient, stopAmbient };
})();

/* =====================================================================
   State machine: 'start' | 'idle' | 'spin' | 'reveal'
   Input is only ever accepted while state === 'idle' — that's the hard
   lock the mash-happy trick-or-treaters need.
   ===================================================================== */
let state = 'start';

function showScreen(name){
  els.screenStart.classList.toggle('active', name === 'start');
  els.screenIdle.classList.toggle('active', name === 'idle');
  els.screenSpin.classList.toggle('active', name === 'spin');
  els.screenReveal.classList.toggle('active', name === 'reveal');
}

function startNight(){
  SFX.unlock();
  if (CONFIG.REQUEST_FULLSCREEN_ON_START && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(() => {});
  }
  goIdle();
}

function goIdle(){
  state = 'idle';
  showScreen('idle');
  SFX.startAmbient();
}

function isAcceptedKey(e){
  const keys = CONFIG.ACCEPTED_KEYS;
  if (keys && keys.length) return keys.includes(e.key);
  // "any key" — but ignore bare modifier taps, which are almost
  // certainly not the arcade button and would false-trigger a spin.
  const modifiers = ['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'];
  return !modifiers.includes(e.key);
}

function onKeyDown(e){
  if (state !== 'idle') return; // hard lock: ignore everything mid-spin/reveal
  if (!isAcceptedKey(e)) return;
  beginSpin();
}

function beginSpin(){
  state = 'spin';
  SFX.stopAmbient();
  showScreen('spin');

  const winner = pickWeightedOutcome(); // chosen UP FRONT, animation just gets there
  const items = buildReelStrip(winner);
  renderReelItems(items);

  const itemHeight = els.reelWindow.clientHeight / CONFIG.REEL_VISIBLE_ROWS;
  els.reelWindow.style.setProperty('--item-height', itemHeight + 'px');

  animateReel({
    finalIndex: items.length - 1,
    itemHeight,
    duration: CONFIG.SPIN_DURATION_MS,
    onTick: () => SFX.tick(),
    onDone: () => showResult(winner),
  });
}

function buildReelStrip(winner){
  const items = [];
  const spinCount = 22 + Math.floor(Math.random() * 6); // a bit of variety spin-to-spin
  for (let i = 0; i < spinCount; i++) items.push(randomOutcome());
  items.push(winner); // guaranteed final item — this is what the reel lands on
  return items;
}

function renderReelItems(items){
  els.reelTrack.innerHTML = items
    .map((o) => `<div class="reel-item tier-${o.tier}">${o.icon} ${o.label}</div>`)
    .join('');
  els.reelTrack.style.transform = 'translateY(0px)';
}

// Winner index is fixed before this runs; we just ease a virtual
// "current index" up to it and translate the strip to match, so ticks
// (via onTick) and the visual landing are always perfectly in sync.
function animateReel({ finalIndex, itemHeight, duration, onTick, onDone }){
  const start = performance.now();
  let lastIndex = -1;
  let lastTickAt = 0;

  function frame(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = easeOutQuint(t);
    const i = finalIndex * eased;
    const y = itemHeight - i * itemHeight; // centers item i in the middle row
    els.reelTrack.style.transform = `translateY(${y}px)`;

    const idx = Math.min(finalIndex, Math.floor(i));
    if (idx !== lastIndex && now - lastTickAt > 24){
      lastIndex = idx;
      lastTickAt = now;
      onTick(idx);
    }

    if (t < 1){
      requestAnimationFrame(frame);
    } else {
      els.reelTrack.style.transform = `translateY(${itemHeight - finalIndex * itemHeight}px)`;
      onDone();
    }
  }
  requestAnimationFrame(frame);
}

function showResult(outcome){
  state = 'reveal';
  showScreen('reveal');
  renderResult(outcome);
  playRevealSound(outcome);
  celebrate(outcome);

  setTimeout(() => {
    clearCelebration();
    goIdle();
  }, CONFIG.RESULT_HOLD_MS);
}

function renderResult(outcome){
  const classes = `tier-${outcome.tier} family-${outcome.family}`;
  els.revealIcon.textContent = outcome.icon;
  els.revealIcon.className = 'reveal-icon ' + classes;
  els.revealLabel.textContent = outcome.label;
  els.revealLabel.className = 'reveal-label ' + classes;
}

function playRevealSound(outcome){
  switch (outcome.id){
    case 'both':         SFX.revealBoth(); break;
    case 'doubleCandy':  SFX.revealDoubleCandy(); break;
    case 'doublePotato': SFX.revealDoublePotato(); break;
    case 'potato':       SFX.revealPotato(); break;
    default:              SFX.revealCandy(); break;
  }
}

// Modest reveal for candy/potato, bigger for doubles, full
// confetti-and-fanfare treatment for the BOTH! jackpot tier. Double
// Potato gets its own goofier treatment (screen shake + bouncing potato
// confetti) so it reads as funnier than Double Candy's elegant sparkle.
function celebrate(outcome){
  flashScreen(outcome.tier);
  if (outcome.id === 'both'){
    launchConfetti(140, { emojis: ['🍬', '🥔', '🎉', '✨', '🍭'] });
  } else if (outcome.id === 'doublePotato'){
    launchConfetti(50, { emojis: ['🥔', '💨'], drop: 'potato' });
    shakeScreen();
  } else if (outcome.id === 'doubleCandy'){
    launchConfetti(35, { emojis: ['🍬', '🍭', '✨'] });
  }
}

function shakeScreen(){
  const el = els.app;
  el.classList.remove('shake');
  void el.offsetWidth; // force reflow so the animation restarts every time
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 550);
}

function clearCelebration(){
  els.confetti.innerHTML = '';
  els.flash.className = '';
}

function flashScreen(tier){
  const el = els.flash;
  el.className = ''; // reset...
  void el.offsetWidth; // ...and force reflow so the animation restarts every time
  el.classList.add('flash-' + (tier === 'jackpot' ? 'jackpot' : tier === 'double' ? 'double' : 'normal'));
}

const CONFETTI_COLORS = ['#ff7518', '#ffd700', '#9b5cff', '#39ff14', '#ff2fb0', '#fdf3d8'];

function launchConfetti(count, opts){
  opts = opts || {};
  const emojis = opts.emojis;
  const dropClass = opts.drop === 'potato' ? ' confetti-potato' : '';
  for (let i = 0; i < count; i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece' + dropClass;
    if (emojis && emojis.length){
      p.classList.add('confetti-emoji');
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.fontSize = (1.2 + Math.random() * 1.6) + 'rem';
    } else {
      p.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    }
    p.style.left = (Math.random() * 100) + 'vw';
    const duration = 2.4 + Math.random() * 2.2;
    const delay = Math.random() * 0.5;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = delay + 's';
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    p.style.setProperty('--drift', (Math.random() * 220 - 110) + 'px');
    els.confetti.appendChild(p);
    setTimeout(() => p.remove(), (duration + delay) * 1000 + 300);
  }
}

function initIdleDecor(){
  for (let i = 0; i < 6; i++){
    const b = document.createElement('div');
    b.className = 'bat';
    b.textContent = '🦇';
    b.style.top = (5 + Math.random() * 55) + '%';
    b.style.fontSize = (1.6 + Math.random() * 1.6) + 'rem';
    b.style.animationDuration = (9 + Math.random() * 8) + 's';
    b.style.animationDelay = (-Math.random() * 14) + 's';
    els.idleDecor.appendChild(b);
  }
  for (let i = 0; i < 4; i++){
    const g = document.createElement('div');
    g.className = 'ghost';
    g.textContent = '👻';
    g.style.left = (8 + Math.random() * 80) + '%';
    g.style.top = (48 + Math.random() * 35) + '%';
    g.style.fontSize = (2 + Math.random() * 2) + 'rem';
    g.style.animationDuration = (4 + Math.random() * 3) + 's';
    g.style.animationDelay = (-Math.random() * 6) + 's';
    els.idleDecor.appendChild(g);
  }
}

/* =====================================================================
   Wire it up
   ===================================================================== */
els.screenStart.addEventListener('click', startNight, { once: true });
window.addEventListener('keydown', onKeyDown);
initIdleDecor();
</script>
</body>
</html>
